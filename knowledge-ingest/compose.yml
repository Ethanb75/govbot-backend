services:
  # scheduled worker (see crontab) that syncs knowledge-base/ into qdrant - no ports
  knowledge-ingest:
    build:
      context: .
    restart: unless-stopped

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://192.168.1.131:6333
      - QDRANT_COLLECTION_NAME=knowledge
      - EMBEDDING_DIMENSIONS=3072
      - KNOWLEDGE_BASE_PATH=/data/knowledge-base
      - APP_STATE_BASE_PATH=/data/state
      - TZ=America/New_York
      - DOTENV_CONFIG_QUIET=true

    volumes:
      - ./knowledge-base:/data/knowledge-base:ro
      - ./app-state:/data/state
