# Who may connect, and from where. Anything not matched here is rejected, so this is what keeps
# 5432 limited to the GovBot hosts even though the port is published to the whole LAN.
# Reloaded by the Ansible playbook whenever it changes.

# TYPE  DATABASE  USER            ADDRESS           METHOD

# inside the container: docker exec admin work, migrations and backups
local   all       all                               trust
host    all       all             127.0.0.1/32      scram-sha-256
host    all       all             ::1/128           scram-sha-256

# knowledge-ingest VM - crawler/ingest writes
host    govbot    govbot_ingest   192.168.1.132/32  scram-sha-256

# rag-api VM - GovBot API reads
host    govbot    govbot_app      192.168.1.133/32  scram-sha-256
