services:
  # scheduled worker (see crontab) that syncs knowledge-base/ into qdrant - no ports
  knowledge-ingest:
    build:
      context: .
    restart: unless-stopped

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://192.168.1.131:6333
      - QDRANT_COLLECTION_NAME=knowledge
      - EMBEDDING_DIMENSIONS=3072
      - KNOWLEDGE_BASE_PATH=/data/knowledge-base
      - APP_STATE_BASE_PATH=/data/state
      - TZ=America/New_York
      - DOTENV_CONFIG_QUIET=true

    volumes:
      - ./knowledge-base:/data/knowledge-base:ro
      - ./app-state:/data/state

  # scheduled worker (see crawler/crontab) that turns government sources into markdown in
  # knowledge-base/ ahead of the ingest run - the only service with write access to it
  knowledge-crawler:
    build:
      context: ./crawler
    restart: unless-stopped

    environment:
      - KNOWLEDGE_BASE_PATH=/data/knowledge-base
      - CRAWLER_STATE_PATH=/data/state
      - CRAWL_TIMEOUT_MINUTES=30
      - TZ=America/New_York
      - DOTENV_CONFIG_QUIET=true

    volumes:
      - ./knowledge-base:/data/knowledge-base
      - ./crawler-state:/data/state
