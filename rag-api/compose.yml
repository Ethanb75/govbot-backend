services:
  # answers questions from the knowledge collection that knowledge-ingest keeps up to date;
  # reached publicly only through the personal-web-app nginx /api/ proxy
  rag-api:
    build:
      context: .
    restart: unless-stopped

    ports:
      - "8090:8090"

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://192.168.1.131:6333
      - QDRANT_COLLECTION_NAME=knowledge
      - EMBEDDING_DIMENSIONS=3072
      - REWRITE_MODEL=gpt-4.1-nano
      - RERANK_MODEL=gpt-4.1-nano
      - ANSWER_MODEL=gpt-5.4-mini
      - CLOUDFLARE_WORKER_API_KEY=${CLOUDFLARE_WORKER_API_KEY}
      - CLOUDFLARE_WORKER_ACCOUNT_ID=ae232e3d069a3122b2bf20b7bfc62892
      # read-only role on govbot-postgres-db, for the executive order lookup tool
      - GOVBOT_DATABASE_URL=postgresql://govbot_app:${GOVBOT_APP_PASSWORD}@192.168.1.134:5432/govbot
      # only the personal-web-app nginx may set X-Forwarded-For
      - TRUSTED_PROXY=192.168.1.128
      - PORT=8090
      - DOTENV_CONFIG_QUIET=true
